plugins {
    id 'com.android.application'
}

android {
    namespace 'com.garimpofood.scanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.garimpofood.scanner"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.5.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
