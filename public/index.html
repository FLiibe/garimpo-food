<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Garimpo 9,99</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GARIMPO 9,99</div>
        <h1>Comida de verdade por até R$9,99.</h1>
      </div>
      <button id="refreshBtn" class="primary">Atualizar</button>
    </header>

    <section class="controls">
      <div class="tabs">
        <button class="tab" data-filter="under1">Até R$0,99</button>
        <button class="tab" data-filter="under5">Até R$4,99</button>
        <button class="tab active" data-filter="under999">Até R$9,99</button>
      </div>
      <input id="searchInput" type="search" placeholder="Buscar combo, frango, burger, pastel...">
    </section>

    <section class="status-card">
      <div>
        <strong id="statusTitle">São Paulo</strong>
        <div id="statusText">Carregando achados...</div>
      </div>
      <div id="lastUpdate" class="muted"></div>
    </section>

    <main id="dealList" class="deal-list"></main>
  </div>

  <template id="dealTemplate">
    <article class="deal-card">
      <div class="deal-top">
        <span class="label"></span>
        <span class="score"></span>
      </div>
      <h2 class="product"></h2>
      <div class="restaurant"></div>
      <div class="price-row">
        <strong class="price"></strong>
      </div>
      <div class="discount"></div>
      <a class="open-link">Ver oferta</a>
    </article>
  </template>

  <script src="/app.js?v=6" defer></script>
</body>
</html>
